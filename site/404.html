<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A0A0A">
  <title>Proposta não encontrada · Isla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500&display=swap">
  <style>
    :root { --ink: #0A0A0A; --porcelain: #F5F5F2; --grey-1: #A3A3A3; --grey-2: #6B6B6B; }
    * { box-sizing: border-box; margin: 0; }
    html { background: var(--ink); color: var(--porcelain); color-scheme: dark; -webkit-font-smoothing: antialiased; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 24px; font-family: "Inter Tight", system-ui, sans-serif; text-align: center; }
    .eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 500; letter-spacing: .22em; text-transform: uppercase; color: var(--grey-1); }
    .eyebrow::before { content: ""; width: 24px; height: 1px; background: var(--grey-2); }
    h1 { font-family: "Instrument Serif", serif; font-weight: 400; font-size: clamp(40px, 6vw, 72px); line-height: 1.02; letter-spacing: -0.02em; margin-top: 20px; }
    p { color: var(--grey-1); margin-top: 16px; }
  </style>
</head>
<body>
  <div>
    <span class="eyebrow">404</span>
    <h1>Essa proposta <em>não existe</em>.</h1>
    <p>Confira o link que você recebeu ou fale com a Isla.</p>
  </div>
</body>
</html>
